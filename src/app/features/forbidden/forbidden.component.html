
<div class="min-h-screen bg-gray-50 flex items-center justify-center px-6">
  <div class="max-w-lg w-full text-center">

    <!-- Icon -->
    <div
      class="mx-auto mb-6 flex h-24 w-24 items-center justify-center rounded-full bg-red-100"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-12 w-12 text-red-600"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="1.8"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M12 9v2m0 4h.01M5.07 19h13.86a2 2 0 001.73-3L13.73 4a2 2 0 00-3.46 0L3.34 16a2 2 0 001.73 3z"
        />
      </svg>
    </div>

    <!-- Error Code -->
    <h1 class="text-8xl font-bold text-red-600">
      403
    </h1>

    <!-- Title -->
    <h2 class="mt-4 text-2xl font-semibold text-gray-800">
      Access Forbidden
    </h2>

    <!-- Description -->
    <p class="mt-3 text-gray-500 leading-relaxed">
      You don't have permission to access this page.
      Please contact your administrator if you believe this is a mistake.
    </p>

    <!-- Actions -->
    <div class="mt-8 flex flex-col sm:flex-row gap-3 justify-center">

      <button
        routerLink="/"
        class="inline-flex items-center justify-center rounded-lg bg-green-600 px-6 py-3 text-sm font-medium text-white transition hover:bg-green-700"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="mr-2 h-5 w-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0h6"
          />
        </svg>

        Back to Home
      </button>

      <button
        type="button"
        onclick="history.back()"
        class="inline-flex items-center justify-center rounded-lg border border-gray-300 bg-white px-6 py-3 text-sm font-medium text-gray-700 transition hover:bg-gray-100"
      >
        Go Back
      </button>

    </div>

  </div>
</div>
