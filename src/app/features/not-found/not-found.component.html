<div class="min-h-screen bg-gray-50 flex items-center justify-center px-6">
  <div class="max-w-lg w-full text-center">

    <!-- Icon -->
    <div
      class="mx-auto mb-6 flex h-24 w-24 items-center justify-center rounded-full bg-green-100"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-12 w-12 text-green-600"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="1.8"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
        />
      </svg>
    </div>

    <!-- Error Code -->
    <h1 class="text-8xl font-bold text-green-600">
      404
    </h1>

    <!-- Title -->
    <h2 class="mt-4 text-2xl font-semibold text-gray-800">
      Page Not Found
    </h2>

    <!-- Description -->
    <p class="mt-3 text-gray-500 leading-relaxed">
      Sorry, the page you're looking for doesn't exist or may have been
      moved to another location.
    </p>

    <!-- Actions -->
    <div class="mt-8 flex flex-col sm:flex-row gap-3 justify-center">

      <button
        routerLink="/"
        class="inline-flex items-center justify-center rounded-lg bg-green-600 px-6 py-3 text-sm font-medium text-white transition hover:bg-green-700"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="mr-2 h-5 w-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0h6"
          />
        </svg>

        Back to Home
      </button>

      <button
        type="button"
        onclick="history.back()"
        class="inline-flex items-center justify-center rounded-lg border border-gray-300 bg-white px-6 py-3 text-sm font-medium text-gray-700 transition hover:bg-gray-100"
      >
        Go Back
      </button>

    </div>

  </div>
</div>
