<div class="flex flex-col">
  <div class="mb-2 flex items-center justify-between gap-4">
    @if (label) {
      <label [for]="id" class="block text-sm font-medium text-slate-700">
        {{ label }}
        @if (required) {
          <span class="text-red-500">*</span>
        }
      </label>
    }

    <ng-content select="[label-suffix]"></ng-content>
  </div>

  <div class="relative">
    <input
      [id]="id"
      [name]="name"
      [type]="type"
      [placeholder]="placeholder"
      [value]="value"
      [disabled]="disabled"
      [required]="required"
      [attr.aria-invalid]="isInvalid"
      (input)="onInput($event)"
      (blur)="onBlur()"
      class="block w-full rounded-xl border bg-white px-4 py-3 text-slate-950 outline-none transition placeholder:text-slate-400 focus:ring-4 disabled:cursor-not-allowed disabled:opacity-60"
      [ngClass]="inputClass"
      [class.border-red-400]="isInvalid"
      [class.focus:border-red-500]="isInvalid"
      [class.focus:ring-red-100]="isInvalid"
      [class.border-slate-300]="!isInvalid"
      [class.focus:border-blue-500]="!isInvalid"
      [class.focus:ring-blue-100]="!isInvalid"
    />

    <ng-content select="[input-suffix]"></ng-content>
  </div>
</div>
